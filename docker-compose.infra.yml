# ═══════════════════════════════════════════════════════════════════════
#  TradingClaw — Infra Only (MySQL + Redis)
#
#  ใช้ตอนพัฒนา/debug แบบรัน engine และ dashboard บนเครื่องตรงๆ:
#
#    1. docker compose -f docker-compose.infra.yml up -d
#    2. cd trading-engine && python main.py
#    3. cd dashboard && npm run dev
#
#  → DB และ Redis รันใน Docker (port 3306, 6379 เปิดออกมาให้ localhost ใช้ได้)
#  → Engine และ Dashboard รันบนเครื่องตรงๆ (hot-reload, debug ได้ง่าย)
# ═══════════════════════════════════════════════════════════════════════

services:

  db:
    image: mysql:8.0
    container_name: regime_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-regime_root_2026}
      MYSQL_DATABASE:      ${MYSQL_DATABASE:-regime_trader}
      MYSQL_USER:          ${MYSQL_USER:-trader}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD:-trader_pass_2026}
    ports:
      - "3306:3306"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: regime_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mysql_data:
  redis_data:
