# ═══════════════════════════════════════════════════════════════════════
#  TradingClaw — Full Stack
#  รัน: docker compose up -d --build
#
#  Ports:
#    3000  Dashboard (Next.js)
#    8080  Trading Engine (Socket.IO)
#    8081  phpMyAdmin  (DB admin UI)
#    3306  MySQL
#    6379  Redis
#
#  Env vars อ่านจาก TradingClaw/.env อัตโนมัติ (docker compose ทำให้)
#  DB_HOST / REDIS_HOST ถูก override เป็น "db" / "redis" ใน docker network
# ═══════════════════════════════════════════════════════════════════════

services:

  # ── MySQL ────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: regime_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-regime_root_2026}
      MYSQL_DATABASE:      ${MYSQL_DATABASE:-regime_trader}
      MYSQL_USER:          ${MYSQL_USER:-trader}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD:-trader_pass_2026}
    ports:
      - "3306:3306"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: regime_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── phpMyAdmin (DB admin UI) ─────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: regime_phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-regime_root_2026}

  # ── Trading Engine (Python) ──────────────────────────────────────────
  trading-engine:
    build: ./trading-engine
    container_name: regime_engine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${MYSQL_DATABASE:-regime_trader}
      - DB_USER=${MYSQL_USER:-trader}
      - DB_PASSWORD=${MYSQL_PASSWORD:-trader_pass_2026}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EXCHANGE=${EXCHANGE:-okx}
      - OKX_API_KEY=${OKX_API_KEY}
      - OKX_SECRET_KEY=${OKX_SECRET_KEY}
      - OKX_PASSPHRASE=${OKX_PASSPHRASE}
      - BYBIT_API_KEY=${BYBIT_API_KEY}
      - BYBIT_SECRET_KEY=${BYBIT_SECRET_KEY}
      - OKX_PASSPHRASE=${OKX_PASSPHRASE}
      - USE_FUTURES=${USE_FUTURES:-true}
      - TRADING_MODE=${TRADING_MODE:-live}
      - SYMBOL=${SYMBOL:-BTCUSDT}
      - TIMEFRAME=${TIMEFRAME:-1h}
      - LOOKBACK_DAYS=${LOOKBACK_DAYS:-180}
      - INITIAL_CAPITAL=${INITIAL_CAPITAL:-0}
      - LEVERAGE=${LEVERAGE:-5}
      - MARGIN_TYPE=${MARGIN_TYPE:-ISOLATED}
      - MAX_DAILY_LOSS=${MAX_DAILY_LOSS:-0.05}
      - MAX_DRAWDOWN=${MAX_DRAWDOWN:-0.15}
      - MAX_OPEN_TRADES=${MAX_OPEN_TRADES:-3}
    volumes:
      - ./trading-engine:/app

  # ── Dashboard (Next.js) ──────────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      args:
        # NEXT_PUBLIC_* ต้องส่งตอน build เพื่อ bake เข้า client JS bundle
        NEXT_PUBLIC_SOCKET_URL: "http://localhost:8080"
    container_name: regime_dashboard
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      trading-engine:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${MYSQL_DATABASE:-regime_trader}
      - DB_USER=${MYSQL_USER:-trader}
      - DB_PASSWORD=${MYSQL_PASSWORD:-trader_pass_2026}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TRADING_ENGINE_HTTP_URL=http://trading-engine:8081
      - EXCHANGE=${EXCHANGE:-okx}
      - OKX_API_KEY=${OKX_API_KEY}
      - OKX_SECRET_KEY=${OKX_SECRET_KEY}
      - OKX_PASSPHRASE=${OKX_PASSPHRASE}
      - BYBIT_API_KEY=${BYBIT_API_KEY}
      - BYBIT_SECRET_KEY=${BYBIT_SECRET_KEY}
      - USE_FUTURES=${USE_FUTURES:-true}
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:8080

  # ── Backtest (one-time job, ไม่รันอัตโนมัติ) ────────────────────────
  # รันด้วย: docker compose run --rm backtest
  # จะ: ดึงข้อมูล 180 วัน → train HMM → simulate → บันทึกลง DB
  # ทำครั้งเดียวพอ (หรือทำซ้ำเมื่ออยากรีเทรน)
  backtest:
    build: ./trading-engine
    container_name: regime_backtest
    profiles: ["backtest"]          # ไม่รันเมื่อ docker compose up ปกติ
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${MYSQL_DATABASE:-regime_trader}
      - DB_USER=${MYSQL_USER:-trader}
      - DB_PASSWORD=${MYSQL_PASSWORD:-trader_pass_2026}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EXCHANGE=${EXCHANGE:-okx}
      - OKX_API_KEY=${OKX_API_KEY}
      - OKX_SECRET_KEY=${OKX_SECRET_KEY}
      - OKX_PASSPHRASE=${OKX_PASSPHRASE}
      - BYBIT_API_KEY=${BYBIT_API_KEY}
      - BYBIT_SECRET_KEY=${BYBIT_SECRET_KEY}
      - USE_FUTURES=${USE_FUTURES:-true}
      - TRADING_MODE=backtest
      - SYMBOL=${SYMBOL:-BTCUSDT}
      - TIMEFRAME=${TIMEFRAME:-1h}
      - LOOKBACK_DAYS=${LOOKBACK_DAYS:-180}
      - INITIAL_CAPITAL=${INITIAL_CAPITAL:-0}
    volumes:
      - ./trading-engine:/app

volumes:
  mysql_data:
  redis_data:
