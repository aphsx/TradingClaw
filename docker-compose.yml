version: "3.8"

services:
  # ═══════════════════════════════════════
  # MySQL Database
  # ═══════════════════════════════════════
  db:
    image: mysql:8.0
    container_name: regime_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-regime_root_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-regime_trader}
      MYSQL_USER: ${MYSQL_USER:-trader}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-trader_pass_2026}
    ports:
      - "3306:3306"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════
  # Trading Engine (Python)
  # ═══════════════════════════════════════
  trading-engine:
    build: ./trading-engine
    container_name: regime_engine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${MYSQL_DATABASE:-regime_trader}
      - DB_USER=${MYSQL_USER:-trader}
      - DB_PASSWORD=${MYSQL_PASSWORD:-trader_pass_2026}
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY}
      - TRADING_MODE=${TRADING_MODE:-backtest}
      - SYMBOL=${SYMBOL:-BTCUSDT}
      - TIMEFRAME=${TIMEFRAME:-1h}
    volumes:
      - ./trading-engine:/app
      - engine_output:/app/output

  # ═══════════════════════════════════════
  # Next.js Dashboard
  # ═══════════════════════════════════════
  dashboard:
    build: ./dashboard
    container_name: regime_dashboard
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql://${MYSQL_USER:-trader}:${MYSQL_PASSWORD:-trader_pass_2026}@db:3306/${MYSQL_DATABASE:-regime_trader}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${MYSQL_DATABASE:-regime_trader}
      - DB_USER=${MYSQL_USER:-trader}
      - DB_PASSWORD=${MYSQL_PASSWORD:-trader_pass_2026}

volumes:
  mysql_data:
  engine_output:
