version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: regime_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-regime_root_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-regime_trader}
      MYSQL_USER: ${MYSQL_USER:-trader}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-trader_pass_2026}
    ports:
      - "3306:3306"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: regime_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  trading-engine:
    build: ./trading-engine
    container_name: regime_engine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${MYSQL_DATABASE:-regime_trader}
      - DB_USER=${MYSQL_USER:-trader}
      - DB_PASSWORD=${MYSQL_PASSWORD:-trader_pass_2026}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY}
      - TRADING_MODE=${TRADING_MODE:-live}
      - SYMBOL=${SYMBOL:-BTCUSDT}
      - TIMEFRAME=${TIMEFRAME:-1h}
    volumes:
      - ./trading-engine:/app

  dashboard:
    build:
      context: ./dashboard
      args:
        # NEXT_PUBLIC_* vars must be passed at BUILD TIME so Next.js can bake them
        # into the client-side JS bundle.  They are fixed for every deployment.
        NEXT_PUBLIC_SOCKET_URL: "http://localhost:8080"
    container_name: regime_dashboard
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      trading-engine:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      # ── Database (use Docker service names, not localhost) ──────────────────
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${MYSQL_DATABASE:-regime_trader}
      - DB_USER=${MYSQL_USER:-trader}
      - DB_PASSWORD=${MYSQL_PASSWORD:-trader_pass_2026}
      # ── Redis ───────────────────────────────────────────────────────────────
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # ── Binance ─────────────────────────────────────────────────────────────
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY}
      - USE_TESTNET=${USE_TESTNET:-true}
      - USE_FUTURES=${USE_FUTURES:-true}
      # ── Socket.IO (client connects from browser → host port 8080) ───────────
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:8080

volumes:
  mysql_data:
  redis_data:
